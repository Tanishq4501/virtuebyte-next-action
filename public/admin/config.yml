# ============================================================
# Decap CMS Configuration — VirtuByte
# ============================================================
# SETUP REQUIRED (2 places marked YOUR_NETLIFY_SITE):
#   Replace with the subdomain Netlify assigns your site,
#   e.g.  shiny-caribou-a1b2c3  →  shiny-caribou-a1b2c3.netlify.app
# ============================================================

backend:
  name: git-gateway
  # Points to the Git Gateway function on your Netlify site.
  # Writers authenticate through Netlify Identity — no GitHub account needed.
  gateway_url: https://YOUR_NETLIFY_SITE.netlify.app/.netlify/functions/git-gateway
  branch: main

# Enables Draft → In Review → Ready workflow
publish_mode: editorial_workflow

# Where uploaded images are physically stored in the repo
media_folder: public/images/blog
# Public URL path served by Next.js (matches /public structure)
public_folder: /images/blog

collections:
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: content/blog
    create: true
    # Filename is auto-generated from the post title
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter

    fields:
      - label: Title
        name: title
        widget: string
        hint: "The post headline shown on the blog listing and post page."

      - label: Publish Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "Controls post sort order on the blog listing."

      - label: Excerpt
        name: excerpt
        widget: text
        hint: "1–2 sentence summary shown on the blog card."

      - label: Meta Description
        name: metaDescription
        widget: text
        hint: "SEO description for Google (150–160 characters recommended). Keep it different from the excerpt."

      - label: Featured Image
        name: featuredImage
        widget: image
        hint: "Hero image for the post. Upload from your computer — stored automatically in /public/images/blog/."

      - label: Tags
        name: tags
        widget: list
        hint: "Topic tags separated by commas (e.g. Salesforce, AI, Manufacturing)."

      - label: Author
        name: author
        widget: string
        required: false
        hint: "Optional. Author name displayed on the post page."

      - label: Body
        name: body
        widget: markdown
        hint: "Main post content. Use the toolbar for headings, bold, links, and images."
